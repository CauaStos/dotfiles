[onfig.wallpaper]
command = "echo"
set = false

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3.css'
output_path = '~/.local/share/themes/Material/gtk-3.0/gtk.css'
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme ''; gsettings set org.gnome.desktop.interface gtk-theme Material; echo 'refreshed gtk'"

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.local/share/themes/Material/gtk-4.0/gtk.css'
post_hook = "gsettings set org.gnome.desktop.interface gtk-theme ''; gsettings set org.gnome.desktop.interface gtk-theme Material; echo 'refreshed gtk'"

[templates.color-scheme-qt]
input_path = '~/.config/matugen/templates/qt.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.zed]
input_path = '~/.config/matugen/templates/zed.json'
output_path = '~/.config/zed/themes/material.json'

[templates.vesktop]
input_path = '~/.config/matugen/templates/discord.css'
output_path = '~/.config/vesktop/themes/material.css'

[templates.niri]
input_path = '~/.config/matugen/templates/niri.kdl'
output_path = '~/.config/niri/config.kdl'

[templates.wezterm]
input_path = '~/.config/matugen/templates/wezterm.lua'
output_path = '~/.wezterm.lua'

[templates.macchina]
input_path = '~/.config/matugen/templates/macchina.toml'
output_path = '~/.config/macchina/themes/Material.toml'

[templates.nvim]
input_path = '~/.config/nvim/pywal/matugen.lua'
output_path = '~/.cache/wal/base46-dark.lua'

[templates.vicinae]
input_path = './templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen'

[templates.pywal]
input_path = '~/.config/matugen/templates/pywal_colors_file'
output_path = '~/.cache/wal/colors'

[templates.kitty]
input_path = 'path/to/template'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty; kitty +kitten themes --reload-in=all your-theme'

#For nvim
[config.custom_colors.red]
color = "#FF0000"
blend = true

[config.custom_colors.green]
color = "#00FF00"
blend = true

[config.custom_colors.yellow]
color = "#FFFF00"
blend = true

[config.custom_colors.blue]
color = "#0000FF"
blend = true

[config.custom_colors.magenta]
color = "#FF00FF"
blend = true

[config.custom_colors.cyan]
color = "#00FFFF"
blend = true

[config.custom_colors.white]
color = "#FFFFFF"
blend = true
