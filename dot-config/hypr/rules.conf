
# █ █ █ █ █▄ █ █▀▄ █▀█ █ █ █   █▀█ █ █ █  █▀▀ █▀
# █▄▀▄█ █ █ ▀█ █▄▀ █▄█ █▄▀▄█   █▀▄ █▄█ █▄ ██▄ ▄█

windowrule = noshadow, floating:0
windowrule = opacity 0.95 0.95, class:.*
windowrule = opacity 1, class:^(zen)

windowrule = float,title:^(About Mozilla Firefox)$
windowrule = float,class:^(firefox)$,title:^(Library)$
windowrule = float,class:^(foot)$,title:^(top)$
windowrule = float,class:^(foot)$,title:^(btop)$
windowrule = float,class:^(foot)$,title:^(htop)$
windowrule = float,class:^(vlc)$
windowrule = float,class:^(kvantummanager)$
windowrule = float,class:^(qt5ct)$
windowrule = float,class:^(qt6ct)$
windowrule = float,class:^(nwg-look)$
windowrule = float,class:^(org.kde.ark)$
windowrule = float,class:^(pavucontrol-qt)$
windowrule = float,class:^(blueman-manager)$
windowrule = float,class:^(nm-applet)$
windowrule = float,class:^(nm-connection-editor)$
windowrule = float,class:^(org.kde.polkit-kde-authentication-agent-1)$
windowrule = float,title:^(Mission Center)$
windowrule = float,class:^(Signal)$ # Signal-Gtk
windowrule = float,class:^(com.github.rafostar.Clapper)$ # Clapper-Gtk
windowrule = float,class:^(app.drey.Warp)$ # Warp-Gtk
windowrule = float,class:^(net.davidotek.pupgui2)$ # ProtonUp-Qt
windowrule = float,class:^(yad)$ # Protontricks-Gtk
windowrule = float,class:^(eog)$ # Imageviewer-Gtk
windowrule = float,class:^(io.github.alainm23.planify)$ # planify-Gtk
windowrule = float,class:^(io.gitlab.theevilssskeleton.Upscaler)$ # Upscaler-Gtk
windowrule = float,class:^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
windowrule = float,class:^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
windowrule = float,class:^(mate-system-monitor)$ # Mate System Monitor
windowrule = float,class:^(zenity)$ # File Select
windowrule = stayfocused,title:^(anyrun)$

#Waydroid
windowrule = float, title:^(Waydroid)
windowrule = noborder, title:^(Waydroid)
windowrule = size 1000 1600, title:^(Waydroid)

#Picture-in-Picture 
windowrule = pin, title:Picture-in-Picture, class:zen
windowrule = float, title:Picture-in-Picture, class:zen
windowrule = move 74% 2%, title:Picture-in-Picture, class:zen
windowrule = size 25%, title:Picture-in-Picture, class:zen
windowrule = keepaspectratio, title:Picture-in-Picture, class:zen

# █  ▄▀█ █ █ █▀▀ █▀█   █▀█ █ █ █  █▀▀ █▀
# █▄ █▀█  █  ██▄ █▀▄   █▀▄ █▄█ █▄ ██▄ ▄█

layerrule = blur,rofi
layerrule = ignorezero,rofi
layerrule = blur,notifications
layerrule = ignorezero,notifications
layerrule = blur,swaync-notification-window
layerrule = ignorezero,swaync-notification-window
layerrule = blur,swaync-control-center
layerrule = ignorezero,swaync-control-center
layerrule = blur,logout_dialog
layerrule = blur,waybar
layerrule = noanim, gtk4-layer-shell



# █ █ █ █▀█ █▀█ █▄▀ █▀ █▀█ ▄▀█ █▀▀ █▀▀   █▀█ █▀▀ █  ▄▀█ ▀█▀ █▀▀ █▀▄
